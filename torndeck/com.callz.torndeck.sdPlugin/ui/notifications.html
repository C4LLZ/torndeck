<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Notifications Settings</title>
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  <style>
    .hint { opacity: 0.6; font-size: 11px; margin: 0; }
  </style>
</head>
<body>
  <sdpi-item label="Torn API Key">
    <sdpi-password setting="apiKey" global placeholder="Your Torn API key"></sdpi-password>
  </sdpi-item>
  <sdpi-item>
    <p class="hint">Shared by every TornDeck key - enter it once.</p>
  </sdpi-item>

  <sdpi-item label="Refresh every (sec)">
    <sdpi-textfield setting="refreshSeconds" placeholder="45" pattern="[0-9]*"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item>
    <p class="hint">Minimum 30s.</p>
  </sdpi-item>

  <sdpi-item>
    <p class="hint">Shows your unread event/message/award/competition count. Flashes red until you press the key to dismiss it - it'll flash again next time something new comes in.</p>
  </sdpi-item>

  <sdpi-item label="Flash for alerts">
    <sdpi-checkbox setting="flashEnabled" label="Enabled" default="true"></sdpi-checkbox>
  </sdpi-item>

  <sdpi-item label="Long-press opens">
    <sdpi-textfield setting="longPressUrl" placeholder="https://www.torn.com"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item>
    <p class="hint">Leave blank to open torn.com (default).</p>
  </sdpi-item>
</body>
</html>
