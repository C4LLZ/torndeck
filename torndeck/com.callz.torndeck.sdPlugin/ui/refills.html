<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Refills Settings</title>
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  <style>
    .hint { opacity: 0.6; font-size: 11px; margin: 0; }
  </style>
</head>
<body>
  <sdpi-item label="Torn API Key">
    <sdpi-password setting="apiKey" global placeholder="Your Torn API key"></sdpi-password>
  </sdpi-item>
  <sdpi-item>
    <p class="hint">Shared by every TornDeck key - enter it once.</p>
  </sdpi-item>

  <sdpi-item label="Refill">
    <sdpi-select setting="refillType" default="energy">
      <option value="energy">Energy</option>
      <option value="nerve">Nerve</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item>
    <p class="hint">Add this key twice to track both.</p>
  </sdpi-item>

  <sdpi-item>
    <p class="hint">Flashes while today's free refill is still available, until you press it to dismiss.</p>
  </sdpi-item>

  <sdpi-item label="Flash for alerts">
    <sdpi-checkbox setting="flashEnabled" label="Enabled" default="true"></sdpi-checkbox>
  </sdpi-item>

  <sdpi-item label="Long-press opens">
    <sdpi-textfield setting="longPressUrl" placeholder="https://www.torn.com"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item>
    <p class="hint">Leave blank to open torn.com (default).</p>
  </sdpi-item>
</body>
</html>
