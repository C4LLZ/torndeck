<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#2a2d38"/>
      <stop offset="100%" stop-color="#15161b"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- stat bars: energy, nerve, happy, life -->
  <g>
    <!-- tracks -->
    <rect x="76"  y="140" width="72" height="260" rx="24" fill="#33353d"/>
    <rect x="172" y="140" width="72" height="260" rx="24" fill="#33353d"/>
    <rect x="268" y="140" width="72" height="260" rx="24" fill="#33353d"/>
    <rect x="364" y="140" width="72" height="260" rx="24" fill="#33353d"/>

    <!-- fills, anchored to bottom -->
    <rect x="76"  y="260" width="72" height="140" rx="24" fill="#8bc34a"/>
    <rect x="172" y="220" width="72" height="180" rx="24" fill="#ff9800"/>
    <rect x="268" y="180" width="72" height="220" rx="24" fill="#ffd700"/>
    <rect x="364" y="140" width="72" height="260" rx="24" fill="#4a90d9"/>
  </g>

  <!-- notification badge -->
  <circle cx="436" cy="96" r="34" fill="#ff3b30"/>
  <circle cx="436" cy="96" r="34" fill="none" stroke="#15161b" stroke-width="6"/>
</svg>
